[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetiguard"
version = "0.1.0"
description = "Uncertainty-calibrated active learning for kinetically faithful molecular force fields"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Ritwij Parmar"}]
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
chemistry = ["ase>=3.23"]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
kg = "kinetiguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
